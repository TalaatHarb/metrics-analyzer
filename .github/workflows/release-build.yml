name: Release Build

on:
  push:
    tags:
      - 'v*' # e.g. v1.0.0

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build with Maven (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          MAVEN_OPTS="--add-opens java.base/java.lang=ALL-UNNAMED" mvn clean compile package -DskipTests

      - name: Build with Maven (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:MAVEN_OPTS="--add-opens java.base/java.lang=ALL-UNNAMED"
          mvn clean compile package -DskipTests
        shell: pwsh

      - name: Rename JAR with tag version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}              # v1.0.0
          VERSION=${TAG_NAME#v}                          # 1.0.0
          cd target
          ORIGINAL_JAR=$(ls metrics-analyzer-*-jar-with-dependencies.jar)
          RENAMED_JAR="metrics-analyzer-${VERSION}-${{ runner.os }}.jar"
          cp "$ORIGINAL_JAR" "$RENAMED_JAR"
          echo "RENAMED_JAR_PATH=target/$RENAMED_JAR" >> $GITHUB_ENV
        shell: bash

      - name: Package standalone Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          $appVersionMatch = [regex]::Match($version, '^\d+(?:\.\d+){0,2}')
          if (-not $appVersionMatch.Success) {
            throw "Release tag must start with a numeric version for jpackage: $version"
          }
          $appVersion = $appVersionMatch.Value
          $target = "target"
          $staging = Join-Path $target "jpackage-input"
          $imageDestination = Join-Path $target "jpackage-output"
          $appName = "MetricsAnalyzer"
          $fatJar = Get-ChildItem -Path "$target\metrics-analyzer-*-jar-with-dependencies.jar" | Select-Object -First 1

          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item $fatJar.FullName -Destination (Join-Path $staging "metrics-analyzer.jar")
          jpackage `
            --type app-image `
            --input $staging `
            --name $appName `
            --main-jar metrics-analyzer.jar `
            --main-class net.talaatharb.analyzer.MetricsAnalyzerLauncher `
            --app-version $appVersion `
            --vendor "Talaat Harb" `
            --dest $imageDestination

          $portableArchive = Join-Path $target "metrics-analyzer-$version-Windows-portable.zip"
          Compress-Archive -Path (Join-Path $imageDestination $appName) -DestinationPath $portableArchive
          "PORTABLE_APP_PATH=target/metrics-analyzer-$version-Windows-portable.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload JAR to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            This release was automatically generated from tag `${{ github.ref_name }}`.
            - Built on `${{ runner.os }}`
            - Includes the JAR file with dependencies.
          files: ${{ env.RENAMED_JAR_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload standalone Windows application to GitHub Release
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.PORTABLE_APP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}